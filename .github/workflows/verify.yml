name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-shapeshifter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve one immutable Helix source commit
        run: node scripts/resolve-helix-root.mjs >> "$GITHUB_ENV"

      - name: Compile and validate exact-revision Helix evidence
        run: |
          npm run sync:helix
          npm run sync:helix:application
          npm run validate:helix

      - name: Freeze prepared evidence for remaining steps
        run: echo "HELIX_EVIDENCE_PREPARED=1" >> "$GITHUB_ENV"

      - name: Run deterministic truthfulness and evidence tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Upload Helix evidence projections and receipts
        uses: actions/upload-artifact@v4
        with:
          name: helix-resume-evidence-${{ github.sha }}
          path: |
            data/helix-resume-evidence.json
            data/helix-resume-evidence.receipt.json
            data/helix-application-intelligence.json
            data/helix-application-intelligence.receipt.json
          if-no-files-found: error
          retention-days: 30
