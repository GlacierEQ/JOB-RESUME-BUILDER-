name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-shapeshifter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HELIX_ROOT_REF: ${{ github.event_name == 'pull_request' && 'feature/portfolio-root-truth-v1' || 'main' }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compile and validate Helix résumé evidence
        run: npm run sync:helix && npm run validate:helix

      - name: Run deterministic truthfulness and evidence tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Upload Helix evidence projection
        uses: actions/upload-artifact@v4
        with:
          name: helix-resume-evidence-${{ github.sha }}
          path: data/helix-resume-evidence.json
          if-no-files-found: error
          retention-days: 30
